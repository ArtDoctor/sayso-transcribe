[package]
name = "transcriber"
version = "1.0.0"
description = "Sayso - Realtime Transcriber Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Sayso"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
